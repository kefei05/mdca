name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # ubuntu-latest 已升到 26.04，那上面 actions/setup-python 没有 Python 3.9 的
    # 预编译包。项目 pyproject 声明 requires-python >= 3.9，所以固定到 22.04 才能真的测到。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（验证 pyproject 可构建）
        run: pip install -e .

      - name: 全量测试
        shell: pwsh
        run: ./run_tests.ps1

      - name: B 路回归基线（必须差异 0 个）
        run: python baseline_b_road.py --diff
