[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdca"
version = "0.4.0"
description = "电机设计约束审计器 —— 审数据能不能用，不算电机的性能"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT with Non-Commercial Clause" }
authors = [{ name = "kefei" }]
keywords = ["motor-design", "audit", "pmsm", "thermal-network", "consistency-check"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kefei05/mdca"
Source = "https://github.com/kefei05/mdca"

[tool.setuptools]
packages = ["mdca"]

[tool.setuptools.package-data]
mdca = ["../grading.json", "../mdca_schema.json"]
